<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VARVEL · governed autonomous red team</title>
<style>
  :root{
    --bg:#0A0D13; --panel:#10141C; --raised:#151A24; --hair:#202634; --hair2:#2A3444;
    --tx:#E6EAF0; --tx2:#9AA3B2; --tx3:#5C6675;
    --steel:#8FA0B5; --steel-hi:#B7C4D6; --steel-lo:#39445A;
    --red:#D8434F; --red-hi:#E5555F;
    --crit:#D34F5E; --high:#E0803C; --med:#7C8596; --low:#5E86A6; --sage:#4FB07A; --cyan:#6FA8B8;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .cap{font:600 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
  .mono{font-family:var(--mono)}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#232B3B;border:2px solid var(--panel)}
  #app{display:grid;grid-template-rows:52px 34px 1fr;height:100vh;min-width:1080px}

  /* header */
  header{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--hair)}
  .emblem{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover;border:1px solid var(--steel-lo)}
  .wm{display:flex;flex-direction:column;line-height:1.05}
  .wm b{font:700 15px var(--sans);letter-spacing:.30em}
  .wm span{font:600 7.5px var(--sans);letter-spacing:.20em;color:var(--tx3)}
  .grow{flex:1}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);background:var(--raised);padding:6px 11px}
  .chip .k{font:700 8px var(--sans);letter-spacing:.15em;color:var(--steel)}
  .chip .v{font:11px var(--mono);color:var(--tx2)} .chip .v b{color:var(--tx)}
  .stat{font:700 10px var(--sans);letter-spacing:.18em;padding:6px 12px;border:1px solid var(--hair);color:var(--tx2)}
  .stat.run{color:var(--sage);border-color:#243B30;background:#0E1512}
  .stat.hold{color:var(--steel-hi);border-color:var(--steel-lo);background:#12141A}
  #recall{font:700 10px var(--sans);letter-spacing:.2em;color:var(--red-hi);background:#170F10;border:1px solid #7A2A31;padding:8px 15px;cursor:pointer}
  #recall:hover{background:#1B0F11;border-color:var(--red)}

  /* module nav */
  nav{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--hair);padding:0 10px}
  nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--tx3);font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:0 14px;cursor:pointer;height:100%}
  nav button:hover{color:var(--tx2)}
  nav button.on{color:var(--tx);border-bottom-color:var(--red)}

  main{overflow:hidden;position:relative}
  .view{display:none;height:100%;overflow:auto;padding:14px 16px}
  .view.on{display:block}
  .cols{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;height:100%}
  .cols>section{min-width:0;display:flex;flex-direction:column;min-height:0}
  .card{background:var(--panel);border:1px solid var(--hair);margin-bottom:12px}
  .card>h3{margin:0;padding:9px 12px;border-bottom:1px solid var(--hair);font:600 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between;align-items:center}
  .card>div{padding:11px 12px}
  .fill{flex:1;min-height:0;display:flex;flex-direction:column}
  .fill>div{flex:1;min-height:0;overflow:auto}

  /* phase rail */
  .rail{display:flex;gap:0}
  .ph{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .ph .d{width:8px;height:8px;border:1px solid var(--tx3);background:transparent}
  .ph .n{font:700 8px var(--sans);letter-spacing:.1em;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph.act .d{background:var(--cyan);border-color:var(--cyan)} .ph.act .n{color:var(--tx)}
  .ph.done .d{background:var(--steel);border-color:var(--steel)} .ph.done .n{color:var(--tx2)}
  .ph.gate .d{border-color:var(--steel)}

  /* activity feed */
  .feed{font-family:var(--mono);font-size:11px}
  .ln{display:flex;gap:8px;padding:3px 2px;border-bottom:1px solid #171C26;align-items:baseline}
  .ln .t{color:var(--tx3);font-size:9px;flex:none;width:58px}
  .ln .k{flex:none;width:96px;color:var(--steel);font-size:9px;letter-spacing:.04em}
  .ln .x{flex:1;color:var(--tx2);min-width:0;word-break:break-word}
  .ln.hold .k{color:var(--steel-hi)} .ln.hold{background:#0E1319}
  .ln.finding .k{color:var(--red)} .ln.exploit .k{color:var(--high)}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;font:600 8.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:6px 8px;border-bottom:1px solid var(--hair)}
  td{padding:6px 8px;border-bottom:1px solid #171C26;color:var(--tx2)} td.mono{font-family:var(--mono)}
  .sev{font:700 8.5px var(--sans);letter-spacing:.08em;padding:2px 7px;border:1px solid;display:inline-block}
  .sev.crit{color:var(--crit);border-color:#4A2630;background:#160F12}
  .sev.high{color:var(--high);border-color:#4A3320;background:#17110C}
  .sev.med{color:var(--med);border-color:#2A3140} .sev.low{color:var(--low);border-color:#28394A}
  .pill{display:inline-block;padding:1px 7px;border:1px solid var(--hair);color:var(--tx3);font:10px var(--mono)}

  /* surface tree */
  .node{padding:5px 8px;border-left:2px solid var(--steel-lo);margin:4px 0 4px 4px}
  .node .lbl{color:var(--tx);font-weight:600} .node .sub{color:var(--tx3);font-size:10px}
  .kids{margin-left:16px;border-left:1px solid #1A2130;padding-left:6px}

  /* chat */
  .thread{display:flex;flex-direction:column;gap:8px}
  .msg{padding:8px 10px;border:1px solid var(--hair);background:var(--raised);font-size:11.5px}
  .msg.me{border-color:var(--steel-lo)} .msg .who{font:700 8px var(--sans);letter-spacing:.14em;color:var(--tx3);margin-bottom:3px}
  .composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--hair);background:var(--panel)}
  .composer input{flex:1;background:var(--bg);border:1px solid var(--hair2);color:var(--tx);padding:9px 11px;font:12px var(--sans)}
  .composer input:focus{outline:none;border-color:var(--steel)}
  .btn{background:var(--raised);border:1px solid var(--hair2);color:var(--tx);padding:8px 14px;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .btn:hover{border-color:var(--steel)} .btn.pri{border-color:var(--red);color:var(--red-hi)} .btn.pri:hover{background:#170F10}
  .btn.go{border-color:#243B30;color:var(--sage)} .btn.go:hover{background:#0E1512}

  /* approval card */
  #gate{border:1px solid var(--steel-lo);background:#0E1319;padding:12px;margin-bottom:12px;display:none}
  #gate.on{display:block}
  #gate .h{font:700 10px var(--sans);letter-spacing:.16em;color:var(--steel-hi);margin-bottom:6px}
  #gate p{margin:0 0 10px;color:var(--tx2);font-size:11.5px}
  #gate .row{display:flex;gap:8px}

  .empty{color:var(--tx3);font-style:italic;padding:16px 4px;font-size:11.5px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #171C26;font-size:11.5px}
  .kv .k{color:var(--tx3)} .kv .v{color:var(--tx);font-family:var(--mono)}
  input,select{font-family:var(--sans)}
  .form label{display:block;margin:9px 0 3px;color:var(--tx3);font:600 9px var(--sans);letter-spacing:.12em;text-transform:uppercase}
  .form input{width:100%;background:var(--bg);border:1px solid var(--hair2);color:var(--tx);padding:8px 10px;font:12px var(--mono)}
  pre.report{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;color:var(--tx2);line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="emblem" src="/assets/emblem.png" alt="VARVEL">
    <div class="wm"><b>VARVEL</b><span>GOVERNED AUTONOMOUS RED TEAM</span></div>
    <div class="chip"><span class="k">SIGNED SCOPE</span><span class="v" id="scopeV"><b>—</b></span></div>
    <div class="grow"></div>
    <div class="chip"><span class="k">ENCLAVE</span><span class="v" style="color:var(--sage)">governed · audited</span></div>
    <div class="stat" id="statusV">IDLE</div>
    <button id="recall" onclick="recall()">RECALL</button>
  </header>

  <nav id="nav"></nav>

  <main>
    <!-- CONSOLE -->
    <div class="view on" id="v-console">
      <div class="cols">
        <section>
          <div class="card"><h3>Phase</h3><div class="rail" id="rail"></div></div>
          <div class="card"><h3>Budget · footprint</h3><div id="mini"></div></div>
          <div class="card fill"><h3>Attack surface</h3><div id="surfMini"></div></div>
        </section>
        <section class="fill">
          <div class="card fill" style="margin:0"><h3>Activity <span class="pill" id="actCount">0</span></h3><div class="feed" id="feed"></div></div>
        </section>
        <section class="fill">
          <div id="gate"></div>
          <div class="card fill" style="margin:0">
            <h3>Operator ↔ agent</h3>
            <div class="thread" id="thread" style="padding:11px 12px"></div>
            <div class="composer">
              <input id="msg" placeholder="Instruct the agent…" onkeydown="if(event.key==='Enter')sendMsg()">
              <button class="btn" onclick="sendMsg()">Send</button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div class="view" id="v-recon"></div>
    <div class="view" id="v-surface"></div>
    <div class="view" id="v-exploit"></div>
    <div class="view" id="v-findings"></div>
    <div class="view" id="v-insights"></div>
    <div class="view" id="v-opsec"></div>
    <div class="view" id="v-settings"></div>
  </main>
</div>

<script>
const MODULES=[["console","Console"],["recon","Recon"],["surface","Attack Surface"],["exploit","Exploit"],["findings","Findings"],["insights","Insights"],["opsec","OPSEC"],["settings","Settings"]];
let STATE=null, cur="console";
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
async function api(p,opts){try{const r=await fetch(p,opts);const ct=r.headers.get("content-type")||"";return ct.includes("json")?r.json():r.text();}catch(e){return null;}}

// nav
const nav=$("#nav");
MODULES.forEach(([id,label])=>{const b=el("button",id===cur?"on":"",label);b.onclick=()=>show(id);b.dataset.m=id;nav.appendChild(b);});
function show(id){cur=id;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.m===id));document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$("#v-"+id).classList.add("on");render();}

const PHASES=["recon","validate","exploit","postex","report"], PHNAME={recon:"Recon",validate:"Validate",exploit:"Exploit",postex:"Post-Ex",report:"Report"};

function render(){
  const s=STATE;
  const surf=s&&s.surface, c=surf&&surf.counts||{};
  // header
  $("#scopeV").innerHTML = surf&&surf.scope ? `<b>${esc(surf.scope.engagement)}</b> · ${esc((surf.scope.cidrs||[]).join(", "))}` : "<b>—</b>";
  const st=$("#statusV"), status=s?s.status:"idle";
  st.textContent=(status||"idle").toUpperCase(); st.className="stat"+(/running/.test(status)?" run":(s&&s.pendingApproval?" hold":""));
  // phase rail
  const idx=s?s.phaseIndex:-1, rail=$("#rail"); rail.innerHTML="";
  PHASES.forEach((p,i)=>{const cls="ph"+(i<idx?" done":i===idx?" act":"")+((p==="exploit"||p==="postex")?" gate":"");rail.appendChild(el("div",cls,`<div class="d"></div><div class="n">${PHNAME[p]}${(p==="exploit"||p==="postex")?" ⚿":""}</div>`));});
  // mini budget/footprint
  const fp=s&&s.opsec&&s.opsec.posture&&s.opsec.posture.footprint||{};
  $("#mini").innerHTML = s? `<div class="kv"><span class="k">step budget</span><span class="v">${s.budget.usedSteps}/${s.budget.maxSteps}</span></div>
    <div class="kv"><span class="k">tool calls</span><span class="v">${fp.toolCalls||0}</span></div>
    <div class="kv"><span class="k">hosts touched</span><span class="v">${fp.hostsTouched||0}</span></div>
    <div class="kv"><span class="k">holds (enclave)</span><span class="v">${fp.holds||0}</span></div>
    <div class="kv"><span class="k">inherited findings</span><span class="v">${s.inheritedFindings||0}</span></div>` : '<div class="empty">no campaign</div>';
  // surface mini (tree)
  $("#surfMini").innerHTML = surf ? surfaceTree(surf) : '<div class="empty">no surface yet</div>';
  // activity feed
  const feed=$("#feed"); if(s&&s.activity){$("#actCount").textContent=s.activity.length;feed.innerHTML=s.activity.slice(-200).map(a=>{
    const k=a.kind, cls="ln"+(k==="hold"?" hold":k==="finding"?" finding":k==="exploit"?" exploit":"");
    return `<div class="${cls}"><span class="t">${(a.at||"").slice(11,19)}</span><span class="k">${esc(k)}</span><span class="x">${esc(fmtEvt(a))}</span></div>`;}).join("");feed.scrollTop=feed.scrollHeight;}
  else feed.innerHTML='<div class="empty">no activity — start a campaign in Settings</div>';
  // chat thread
  renderThread();
  // gate
  renderGate();
  // active module views
  if(cur==="recon"||cur==="surface") renderSurfaceView();
  if(cur==="exploit") renderExploit();
  if(cur==="findings") renderFindings();
  if(cur==="opsec") renderOpsec();
  if(cur==="insights") renderInsights();
  if(cur==="settings") renderSettings();
}
function fmtEvt(a){const d=a.data||{};switch(a.kind){
  case"phase.start":return `entering ${d.phase}${d.gate==="sigil"?" (HITL gate)":""}`;
  case"phase.result":return `${d.phase} complete · ${d.steps} steps · ${d.denials} held`;
  case"finding":return `[${d.sev}] ${d.title} ${d.ref?"("+d.ref+")":""}`;
  case"exploit":return `${d.title} — ${d.result}`;
  case"hold":return `enclave held: ${d.action}`;
  case"artifact":return `artifact ${d.kind} @ ${d.host}:${d.path}`;
  case"gate.request":return `awaiting countersignature — ${d.phase}`;
  case"gate.decision":return `${d.phase} ${d.signed?"countersigned":"declined"}`;
  case"memory.inherit":return `inherited ${d.findings} findings from prior sessions`;
  case"campaign.start":return `campaign started · ${(d.scope&&d.scope.engagement)||""}`;
  case"campaign.done":return `campaign complete`;
  default:return JSON.stringify(d);}}

function surfaceTree(surf){
  const nodes=surf.nodes||[], edges=surf.edges||[];
  const root=nodes.find(n=>n.type==="root"); if(!root)return '<div class="empty">—</div>';
  const kids=id=>edges.filter(e=>e.from===id).map(e=>nodes.find(n=>n.id===e.to)).filter(Boolean);
  const draw=(n,depth)=>{
    let h=`<div class="node"><span class="lbl">${esc(n.label)}</span> <span class="sub">${esc(n.type)}${n.sev?" · "+n.sev:""}${n.state?" · "+n.state:""}</span></div>`;
    const k=kids(n.id); if(k.length&&depth<3)h+=`<div class="kids">${k.map(c=>draw(c,depth+1)).join("")}</div>`; return h;};
  return draw(root,0);
}
function renderThread(){const t=$("#thread");if(!t)return;const msgs=(STATE&&STATE.messages)||window._localMsgs||[];
  t.innerHTML = msgs.length? msgs.map(m=>`<div class="msg me"><div class="who">OPERATOR</div>${esc(m.text)}</div>`).join("") : '<div class="empty">Send an instruction to the agent. It runs governed inside the signed scope.</div>';}
function renderGate(){const g=$("#gate");if(!g)return;const p=STATE&&STATE.pendingApproval;
  if(!p){g.classList.remove("on");g.innerHTML="";return;}
  g.classList.add("on");
  g.innerHTML=`<div class="h">⚿ HITL GATE — ${esc(p.toUpperCase())}</div><p>The agent has reached a gated phase and is held pending your countersignature. The Enclave enforces this independently.</p><div class="row"><button class="btn go" onclick="approve('${esc(p)}',false)">Countersign</button><button class="btn pri" onclick="approve('${esc(p)}',true)">Decline</button></div>`;}

function viewCard(title,inner){return `<div class="card"><h3>${title}</h3><div>${inner}</div></div>`;}
function findingRows(surf){const f=(surf.nodes||[]).filter(n=>n.type==="finding");if(!f.length)return'<div class="empty">no findings yet</div>';
  const host=id=>{const e=(surf.edges||[]).find(x=>x.to===id);const p=e&&(surf.nodes||[]).find(n=>n.id===e.from);return p?p.label:"—";};
  return `<table><tr><th>Severity</th><th>Finding</th><th>Host</th><th>Ref</th></tr>${f.map(n=>`<tr><td><span class="sev ${n.sev}">${(n.sev||"").toUpperCase()}</span></td><td>${esc(n.label)}</td><td class="mono">${esc(host(n.id))}</td><td class="mono">${esc(n.ref||"")}</td></tr>`).join("")}</table>`;}
function renderSurfaceView(){const surf=STATE&&STATE.surface;const v=$("#v-"+cur);
  if(!surf){v.innerHTML=viewCard("Attack surface",'<div class="empty">no campaign running</div>');return;}
  const hosts=(surf.nodes||[]).filter(n=>n.type==="host"), svc=(surf.nodes||[]).filter(n=>n.type==="svc");
  v.innerHTML=viewCard("Hosts in scope · "+hosts.length,
    `<table><tr><th>Host</th><th>IP</th><th>Services</th></tr>${hosts.map(h=>{const ss=svc.filter(s=>s.host===h.id).map(s=>s.label).join(", ");return `<tr><td>${esc(h.label)}</td><td class="mono">${esc(h.ip||"")}</td><td class="mono">${esc(ss||"—")}</td></tr>`;}).join("")||'<tr><td colspan=3 class="empty">none</td></tr>'}</table>`)
    + viewCard("Surface graph", `<div style="padding:2px">${surfaceTree(surf)}</div>`);}
function renderExploit(){const surf=STATE&&STATE.surface;const v=$("#v-exploit");const ex=surf?(surf.nodes||[]).filter(n=>n.type==="exploit"):[];
  v.innerHTML=viewCard("Exploit chains",ex.length?`<table><tr><th>Exploit</th><th>State</th><th>Ref</th></tr>${ex.map(e=>`<tr><td>${esc(e.label)}</td><td><span class="sev ${e.state==="proved"?"high":"med"}">${esc((e.state||"").toUpperCase())}</span></td><td class="mono">${esc(e.ref||"")}</td></tr>`).join("")}</table>`:'<div class="empty">no exploits — exploit phase is HITL-gated</div>');}
function renderFindings(){const surf=STATE&&STATE.surface;$("#v-findings").innerHTML=viewCard("Findings",surf?findingRows(surf):'<div class="empty">no campaign</div>');}
function renderOpsec(){const o=STATE&&STATE.opsec;const v=$("#v-opsec");if(!o){v.innerHTML=viewCard("OPSEC","<div class='empty'>no campaign</div>");return;}
  const p=o.posture||{};
  v.innerHTML=viewCard("Engagement hygiene — "+(p.cleanState?"TARGET CLEAN":"CLEANUP PENDING"),
    `<div class="kv"><span class="k">artifacts dropped</span><span class="v">${p.artifacts||0}</span></div><div class="kv"><span class="k">cleaned</span><span class="v">${p.cleaned||0}</span></div><div class="kv"><span class="k">pending cleanup</span><span class="v">${p.pending||0}</span></div><p style="color:var(--tx2);margin:8px 0 0">${esc(p.note||"")}</p><p style="color:var(--tx3);font-size:10.5px">"Clean the target, keep the proof" — leftover artifacts are removed from the client; the Enclave keeps the tamper-evident audit.</p>`)
  + viewCard("Artifact ledger", (o.artifacts&&o.artifacts.length)?`<table><tr><th>Host</th><th>Kind</th><th>Path</th><th>Status</th><th></th></tr>${o.artifacts.map((a,i)=>`<tr><td class="mono">${esc(a.host)}</td><td>${esc(a.kind)}</td><td class="mono">${esc(a.path)}</td><td>${a.status==="cleaned"?'<span class="sev low">CLEANED</span>':'<span class="sev high">DROPPED</span>'}</td><td>${a.status==="cleaned"?"":`<button class="btn" onclick="cleanup(${i})">Clean</button>`}</td></tr>`).join("")}</table>`:'<div class="empty">no artifacts dropped</div>');}
function renderInsights(){const s=STATE;const v=$("#v-insights");const c=s&&s.surface&&s.surface.counts||{};
  v.innerHTML=viewCard("Engagement insights",
    `<div class="kv"><span class="k">hosts</span><span class="v">${c.hosts||0}</span></div><div class="kv"><span class="k">services</span><span class="v">${c.svcs||0}</span></div><div class="kv"><span class="k">findings</span><span class="v">${c.findings||0} (crit ${c.crit||0})</span></div><div class="kv"><span class="k">exploits</span><span class="v">${c.exploits||0}</span></div><div class="kv"><span class="k">enclave holds</span><span class="v">${c.holds||0}</span></div>`)
  + viewCard('Client report <button class="btn" onclick="loadReport()" style="float:right;margin-top:-4px">Generate</button>','<pre class="report" id="reportBox"><span class="empty">Generate to render the client-ready report.</span></pre>');}
function renderSettings(){const v=$("#v-settings");if(v.dataset.init)return;v.dataset.init="1";
  v.innerHTML=viewCard("Start engagement",
    `<div class="form"><label>Engagement</label><input id="f-eng" value="ACME-2231"><label>Signed by</label><input id="f-sig" value="M.Vale L4"><label>Scope (CIDRs, comma-separated)</label><input id="f-cidr" value="10.10.0.0/16"><label>Step budget</label><input id="f-bud" value="200"></div><div style="margin-top:12px"><button class="btn go" onclick="startCampaign()">▸ Launch campaign (demo)</button></div><p style="color:var(--tx3);font-size:10.5px;margin-top:10px">Demo mode uses a mock agent — no API key, no real tools. Live mode runs the governed agent against the signed scope.</p>`);}

// actions
async function startCampaign(){const scope={engagement:$("#f-eng").value,signedBy:$("#f-sig").value,cidrs:$("#f-cidr").value.split(",").map(x=>x.trim()).filter(Boolean)};const budget={maxSteps:Number($("#f-bud").value)||200};await api("/api/campaign",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:"demo",scope,budget})});show("console");poll();}
async function approve(phase,deny){await api("/api/approve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({phase,deny})});poll();}
async function cleanup(i){await api("/api/opsec/cleanup",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({index:i})});poll();}
window._localMsgs=[];
async function sendMsg(){const inp=$("#msg");const t=inp.value.trim();if(!t)return;window._localMsgs.push({text:t});inp.value="";renderThread();await api("/api/message",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:t})});}
async function loadReport(){const md=await api("/api/report");$("#reportBox").textContent=(typeof md==="string"?md:(md&&md.report)||"no report");}
function recall(){if(confirm("RECALL — signal the agent to stand down? (In live mode this kills the session to glove; the Enclave enforces it.)"))api("/api/message",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:"RECALL — stand down immediately."})});}

// live
async function poll(){const s=await api("/api/state");if(s){STATE=s;render();}}
try{const ev=new EventSource("/api/events");ev.onmessage=()=>poll();}catch(e){}
setInterval(poll,1600); poll();
</script>
</body>
</html>
